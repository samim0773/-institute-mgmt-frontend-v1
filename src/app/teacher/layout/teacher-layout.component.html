<!-- teacher-layout.component.html -->
<mat-sidenav-container class="layout-container" autosize>

  <mat-sidenav #sidenav [mode]="sidenavMode" [opened]="sidenavOpened" class="sidebar" fixedInViewport>
    <!-- Brand + Institute name -->
    <div class="sidebar-brand">
      <div class="brand-logo-box">
        <mat-icon class="brand-icon">school</mat-icon>
      </div>
      <div class="brand-text-group">
        <span class="brand-app-name">InstituteMS</span>
        <span class="brand-inst-name" *ngIf="instituteName" [title]="instituteName">
          {{ instituteName }}
        </span>
        <span class="brand-inst-name brand-inst-name--placeholder" *ngIf="!instituteName">
          Teacher Portal
        </span>
      </div>
    </div>

    <!-- Institute name banner -->
    <div class="inst-name-banner" *ngIf="instituteName">
      <mat-icon class="inst-banner-icon">business</mat-icon>
      <span class="inst-banner-text">{{ instituteName }}</span>
    </div>

    <mat-divider></mat-divider>

    <!-- Subject badge -->
    <div class="subject-badge">
      <mat-icon>book</mat-icon>
      <span>{{ userSubject }}</span>
    </div>

    <!-- Nav items -->
    <mat-nav-list class="nav-list">
      <a mat-list-item *ngFor="let item of navItems"
        [routerLink]="item.route"
        class="nav-item"
        [class.nav-item--active]="isActive(item.route)"
        (click)="closeOnMobile()"
      >
        <mat-icon matListItemIcon class="nav-icon">{{ item.icon }}</mat-icon>
        <span matListItemTitle>{{ item.label }}</span>
      </a>
    </mat-nav-list>

    <!-- Footer -->
    <div class="sidebar-footer">
      <mat-divider></mat-divider>
      <div class="footer-inner">
        <div class="user-avatar">{{ userInitial }}</div>
        <div class="user-info">
          <span class="user-name">{{ userName }}</span>
          <span class="user-role">Teacher</span>
        </div>
      </div>
    </div>
  </mat-sidenav>

  <mat-sidenav-content class="content-area">
    <!-- Toolbar -->
    <mat-toolbar class="toolbar" color="primary">
      <button mat-icon-button (click)="toggleSidenav()" aria-label="Toggle menu">
        <mat-icon>{{ sidenav.opened ? 'menu_open' : 'menu' }}</mat-icon>
      </button>
      <span class="toolbar-title">{{ userSubject }}</span>
      <span class="spacer"></span>
      <a mat-icon-button routerLink="/teacher/dashboard"
         matTooltip="Home" aria-label="Go to dashboard">
        <mat-icon>home</mat-icon>
      </a>
      <button mat-icon-button [matMenuTriggerFor]="userMenu">
        <div class="toolbar-avatar">{{ userInitial }}</div>
      </button>
      <mat-menu #userMenu="matMenu" xPosition="before">
        <div class="menu-user" mat-menu-item disabled>
          <strong>{{ userName }}</strong>
          <small>{{ userSubject }}</small>
        </div>
        <mat-divider></mat-divider>
        <a mat-menu-item routerLink="/teacher/change-password">
          <mat-icon>lock</mat-icon> Change Password
        </a>
        <mat-divider></mat-divider>
        <button mat-menu-item (click)="logout()" class="logout-item">
          <mat-icon>logout</mat-icon> Sign Out
        </button>
      </mat-menu>
    </mat-toolbar>

    <main class="page-content">
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>

</mat-sidenav-container>
