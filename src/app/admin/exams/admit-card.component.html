<!-- admit-card.component.html  — preview + 2-per-A4 print wrapper -->
<div class="admit-page">

  <!-- ── Screen-only toolbar ──────────────────────────────────────────────── -->
  <div class="admit-toolbar no-print">
    <button mat-icon-button (click)="goBack()" aria-label="Back"><mat-icon>arrow_back</mat-icon></button>
    <span class="toolbar-title">
      {{ admitCard?.student?.name || 'Admit Card' }}
    </span>
    <span class="spacer"></span>
    <button
      mat-raised-button
      color="primary"
      (click)="printAdmitCard()"
      [disabled]="loading || !admitCard"
      class="print-btn"
    >
      <mat-icon>print</mat-icon> Print Admit Card
    </button>
  </div>

  <!-- Loading -->
  <div *ngIf="loading" class="loading-center no-print">
    <mat-spinner diameter="48"></mat-spinner>
    <p>Loading admit card…</p>
  </div>

  <!--
    Print area — NO "no-print" here.
    This div is visible on screen (as a preview) AND on paper.
    The global @media print rule positions it at top:0/left:0 and makes
    its subtree visible while hiding everything else via visibility:hidden.
  -->
  <div *ngIf="!loading && admitCard" class="print-area admit-print-sheet">

    <!-- Screen-only hint (hidden when printing) -->
    <p class="preview-hint no-print">
      <mat-icon>info_outline</mat-icon>
      Print preview — 2 admit cards per A4 sheet (Office Copy &amp; Student Copy)
    </p>

    <!-- ── Copy 1: Office Copy ─────────────────────────────────────────── -->
    <app-admit-card-print [card]="admitCard" copyLabel="Office Copy"></app-admit-card-print>

    <!-- ── Scissor cut line ────────────────────────────────────────────── -->
    <div class="ac-cut-line">
      <span class="cut-text">✂&nbsp;&nbsp; CUT HERE &nbsp;&nbsp;✂</span>
    </div>

    <!-- ── Copy 2: Student Copy ───────────────────────────────────────── -->
    <app-admit-card-print [card]="admitCard" copyLabel="Student Copy"></app-admit-card-print>

  </div>

</div>
